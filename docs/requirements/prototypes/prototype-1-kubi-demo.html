<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0078B4">
<title>KuBi — Demo</title>
<!--
  KuBi — Clinic Operating System
  Design language from the KB Dental Clinical Suite: medical blue #0078B4,
  #F0F6FB section bars with a 3px left rule, uppercase tracked labels.

  The parameter and activity structure is embedded, so Parameters,
  Activities and Reports are populated the moment the app opens — before a
  single task exists. An operating system should show what it governs, not
  only what happened today.
-->
<style>
:root{
  --blue:#0078B4; --blue-hi:#0090CC; --blue-dk:#005F91;
  --blue-tint:#F0F6FB; --blue-tint2:#DCF4FB; --blue-wash:#F8FBFE;
  --green:#059669; --green-tint:#F0FFF4;
  --amber:#D97706; --amber-tint:#FFFBF0;
  --red:#C0392B; --red-2:#E24B4A; --red-tint:#FFF0F0;
  --purple:#7C3AED; --purple-tint:#F5F0FF;
  --grey:#6B7280; --grey-tint:#F5F5F5;
  --ink:#222; --ink-2:#555; --ink-3:#777; --ink-4:#9AA5AE;
  --bg:#F4F6F8; --surface:#FFF; --line:#E5E9ED; --line-2:#D5DCE2;
  --r:8px; --r-sm:6px; --r-lg:12px;
  --sh:0 1px 3px rgba(20,30,40,.07); --sh-2:0 4px 20px rgba(20,30,40,.09);
  --sh-3:0 10px 40px rgba(0,0,0,.25);
  --safe:env(safe-area-inset-bottom,0px); --nav:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + var(--safe))}
.hide{display:none!important}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#c8d0d6;border-radius:4px}

h1,h2,h3{font-weight:700;letter-spacing:-.01em}
.t-xl{font-size:30px;letter-spacing:-.025em;font-weight:800}
.t-lg{font-size:18px}.t-md{font-size:15px}
.cap{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue)}
.cap-g{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.sub{font-size:12.5px;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.02em}

header{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;padding:12px 16px;
  display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
header h1{font-size:17px}header .who{font-size:11px;opacity:.9;display:block;margin-top:1px}
.hbtn{height:32px;min-width:32px;padding:0 10px;border:0;border-radius:var(--r-sm);
  background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:12px;font-weight:700;
  cursor:pointer;display:grid;place-items:center}
.hbtn:hover{background:rgba(255,255,255,.3)}
main{padding:14px 16px 32px;max-width:1000px;margin:0 auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card-p{padding:16px}
.sec{background:var(--blue-tint);border-left:3px solid var(--blue);padding:8px 12px;
  font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);
  display:flex;align-items:center;gap:8px}
.sec .n{margin-left:auto;color:var(--ink-3);font-size:11px}
.sec.warn{background:var(--amber-tint);border-left-color:var(--amber);color:#8a5a00}
.sec.bad{background:var(--red-tint);border-left-color:var(--red);color:var(--red)}
.sec.ok{background:var(--green-tint);border-left-color:var(--green);color:var(--green)}

.btn{background:var(--blue);color:#fff;border:0;border-radius:var(--r);padding:12px 18px;
  font:inherit;font-weight:700;cursor:pointer;width:100%;transition:background .12s}
.btn:hover{background:var(--blue-hi)}.btn:disabled{opacity:.45}
.btn.sm{width:auto;padding:7px 13px;font-size:13px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--blue-tint);border-color:var(--blue)}
.btn.ok{background:var(--green)}.btn.bad{background:var(--red)}
.btn.big{padding:15px;font-size:16px;border-radius:var(--r-lg)}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
label{display:block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-2);margin:14px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);
  border-radius:var(--r-sm);background:#fff;color:var(--ink);font:inherit}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
  padding:3px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.c-blue{background:var(--blue-tint2);color:var(--blue)}
.c-green{background:var(--green-tint);color:var(--green)}
.c-amber{background:var(--amber-tint);color:#8a5a00}
.c-red{background:var(--red-tint);color:var(--red)}
.c-grey{background:var(--grey-tint);color:var(--ink-3)}
.c-purple{background:var(--purple-tint);color:var(--purple)}

/* ── Dashboard hero ── */
.hero{display:flex;align-items:center;gap:20px;padding:20px 18px;
  background:linear-gradient(160deg,var(--blue-wash),#fff 60%)}
.ring{position:relative;flex:0 0 auto}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .v b{font-size:30px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.ring .v i{font-size:9px;font-style:normal;font-weight:800;letter-spacing:.07em;color:var(--ink-3)}

/* ── KPI grid ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line)}
.kpi{background:#fff;padding:13px 14px;cursor:pointer;transition:background .12s}
.kpi:hover{background:var(--blue-wash)}
.kpi .kt{display:flex;align-items:baseline;gap:6px}
.kpi b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.kpi .of{font-size:11px;color:var(--ink-4)}
.kpi .kl{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.3}
.meter{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:4px;transition:width .3s}
.kpi .dev{font-size:10px;font-weight:800;color:var(--red);margin-top:5px}

/* ── Stat strip ── */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;background:var(--line)}
.st{background:#fff;padding:12px 10px;text-align:center}
.st b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.st span{font-size:10px;color:var(--ink-3);font-weight:600}

/* ── Rows ── */
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);
  background:#fff;transition:background .12s}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}.row.click:hover{background:var(--blue-wash)}
.row .grow{flex:1;min-width:0}
.row .arw{color:var(--ink-4);font-size:16px}
.dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%}
.d-green{background:var(--green)}.d-amber{background:var(--amber)}
.d-red{background:var(--red)}.d-grey{background:var(--line-2)}
.rname{font-weight:600;line-height:1.3}
.rmeta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ── Task row (staff) ── */
.task{position:relative;display:flex;gap:14px;align-items:center;padding:15px 16px 15px 19px;
  border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
.task:last-child{border-bottom:0}.task:hover{background:var(--blue-wash)}
.task.attn{background:var(--red-tint)}.task.late{background:var(--amber-tint)}
.task.settled{background:#fcfdfe}
.pri{position:absolute;left:0;top:0;bottom:0;width:3px}
.pri-PATIENT_SAFETY{background:var(--red)}.pri-CRITICAL{background:var(--amber)}
.pri-IMPORTANT{background:var(--blue)}.pri-ROUTINE{background:var(--line-2)}
.tick{width:40px;height:40px;flex:0 0 40px;border-radius:11px;border:2px solid var(--line-2);
  background:#fff;display:grid;place-items:center;font-size:19px;color:transparent;transition:all .12s}
.task:hover .tick{border-color:var(--blue)}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.tick.ver{background:var(--blue);border-color:var(--blue);color:#fff}
.tick.na{background:var(--ink-4);border-color:var(--ink-4);color:#fff}
.tick.lock{border-style:dashed;color:var(--ink-4);background:var(--grey-tint)}
.task.attn .tick:not(.on):not(.ver):not(.na){border-color:var(--red)}
.ttitle{font-weight:600;font-size:15.5px;line-height:1.35}
.task.settled .ttitle{color:var(--ink-3)}
.blocked{margin-top:8px;padding:8px 11px;background:var(--amber-tint);color:#8a5a00;
  border-radius:var(--r-sm);font-size:12px;font-weight:600}

/* ── Bars for reports ── */
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:0}
.bar-lbl{flex:0 0 40%;font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:18px;background:var(--grey-tint);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.bar-val{flex:0 0 62px;text-align:right;font-weight:800;font-size:13px}

/* ── Detail table ── */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px}
th{background:var(--blue-tint);text-align:left;padding:8px 10px;font-size:10px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;color:var(--blue);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EFF3F6;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--blue-wash)}

/* ── Toggle ── */
.sw{width:42px;height:24px;flex:0 0 42px;border-radius:20px;background:var(--line-2);
  position:relative;cursor:pointer;transition:background .16s;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .16s;box-shadow:var(--sh)}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(18px)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe);box-shadow:0 -2px 8px rgba(0,0,0,.05)}
nav button{flex:1;background:0;border:0;padding:8px 2px;color:var(--ink-3);cursor:pointer;font:inherit;
  font-size:9.5px;font-weight:700;display:grid;gap:3px;justify-items:center;position:relative}
nav button.on{color:var(--blue)}nav button i{font-style:normal;font-size:18px;line-height:1}
nav .dot-n{position:absolute;top:3px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;
  background:var(--red);color:#fff;border-radius:9px;font-size:9px;font-weight:800;display:grid;place-items:center}

.scrim{position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:50;display:grid;
  align-items:end;justify-items:center;animation:fd .15s ease}
@keyframes fd{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:1000px;border-radius:16px 16px 0 0;max-height:92vh;
  overflow:auto;box-shadow:var(--sh-3);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px)}}
.sheet-h{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 18px;z-index:2}
.sheet-b{padding:0}.sheet-f{padding:16px 18px calc(20px + var(--safe));display:grid;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px + var(--safe));
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:14px;
  font-weight:600;z-index:70;max-width:88%;box-shadow:var(--sh-2)}
.toast.bad{background:var(--red)}.toast.ok{background:var(--green)}

.empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
.empty .ico{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;background:var(--green-tint);
  color:var(--green);display:grid;place-items:center;font-size:24px}
.empty .ttl{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
.seg{display:flex;gap:0;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:#fff;border:0;padding:9px 6px;font:inherit;font-size:12.5px;font-weight:650;
  color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}
aside{display:none}

@media (min-width:920px){
  body{padding-bottom:0}
  #app:not(.hide){display:flex;min-height:100vh}
  nav{display:none}
  aside{display:flex;flex-direction:column;width:230px;flex:0 0 230px;background:#fff;
    border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:15px 18px;background:var(--blue);color:#fff}
  .brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .brand span{font-size:10.5px;opacity:.9}
  .side{padding:10px;flex:1}
  .side button{width:100%;text-align:left;background:0;border:0;color:var(--ink-2);padding:9px 12px;
    border-radius:var(--r-sm);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
    display:flex;gap:10px;align-items:center;margin-bottom:2px}
  .side button:hover{background:var(--blue-tint);color:var(--blue)}
  .side button.on{background:var(--blue);color:#fff}
  .side .bdg{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;
    padding:1px 6px;border-radius:9px}
  .side .grp{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-4);padding:14px 12px 5px}
  .side-f{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
  #shell{flex:1;min-width:0}
  header{padding:14px 26px}
  main{padding:20px 26px 40px;max-width:1180px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .grid2 .card{margin-bottom:0}
  .scrim{align-items:center;padding:26px}
  .sheet{border-radius:var(--r-lg);max-height:88vh}
  .toast{bottom:26px}
}
</style>
</head>
<body>

<div id="login">
  <main style="max-width:390px;padding-top:46px">
    <div style="text-align:center;margin-bottom:22px">
      <div style="width:60px;height:60px;margin:0 auto;border-radius:16px;background:var(--blue);
        color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;box-shadow:var(--sh-2)">Ku</div>
      <h1 class="t-xl" style="margin-top:14px;color:var(--blue)">KuBi</h1>
      <div class="sub">K.B. Dental — Clinic Operating System</div>
    </div>
    <div class="card card-p">
      <div id="cfgWarn" class="chip c-amber hide" style="margin-bottom:10px"></div>
      <label data-t="mobile">Mobile number</label>
      <input id="lPhone" type="tel" inputmode="numeric" placeholder="10 digits">
      <label data-t="pin">PIN</label>
      <input id="lPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
      <div style="height:16px"></div>
      <button class="btn big" id="bLogin" data-t="signIn">Sign in</button>
      <div style="height:9px"></div>
      <button class="btn ghost sm" style="width:100%" id="bCfg" data-t="server">Server settings</button>
      <div style="display:flex;gap:6px;justify-content:center;margin-top:13px">
        <button class="btn ghost sm" data-lang="en">English</button>
        <button class="btn ghost sm" data-lang="hi">हिंदी</button>
      </div>
    </div>
  </main>
</div>

<div id="app" class="hide">
  <aside>
    <div class="brand"><b>KuBi</b><span>K.B. Dental</span></div>
    <div class="side" id="side"></div>
    <div class="side-f">
      <button class="btn ghost sm" id="bCfg2" data-t="server">Server settings</button>
      <button class="btn ghost sm" id="bOut" data-t="signOut">Sign out</button>
    </div>
  </aside>
  <div id="shell">
    <header>
      <div style="flex:1;min-width:0"><h1 id="vTitle">Dashboard</h1><span class="who" id="vWho"></span></div>
      <button class="hbtn" id="bLang">हिंदी</button>
    </header>
    <main id="view"></main>
  </div>
  <nav id="nav"></nav>
</div>


<script>
// ── Embedded dictionary: 16 control parameters, 119 activities ──
var P_META={
  ATTENDANCE_LEAVE: { name:"Attendance & Leave", control:"Reporting time, late arrival, absence, leave request, approval, Saturday–Monday sandwich rule, attendance compliance", rollsInto:"Team Compliance Score", kpis:["On-Time Attendance %","Attendance Record Completeness %","Planned Leave Compliance %","Leave Approval SLA %"] },
  OPENING_READINESS: { name:"Opening Readiness", control:"Clinic opened on time, floors ready, AC/diffuser/lights, water, reception, treatment rooms, equipment readiness", rollsInto:"Clinic Readiness Score", kpis:["Opening On-Time %","Room Readiness %","Reception Readiness %","Environment Compliance %","Emergency Readiness %"] },
  CLEANLINESS: { name:"Cleanliness & Housekeeping", control:"Treatment rooms, chairs, slabs, mirrors, washrooms, reception, staff areas, high-touch surfaces, plants", rollsInto:"Clinic Readiness Score", kpis:[] },
  MAINTENANCE_UTILITIES: { name:"Maintenance & Utilities", control:"AC, plumbing, electricals, chairs, compressor, suction, switches, doors, faucets, water pump, repair reporting", rollsInto:"Clinic Readiness Score", kpis:["Equipment Availability %","PM Compliance %","Calibration Compliance %","Breakdown Reporting Time","Verified Return-to-Service %","AMC/Warranty Coverage %"] },
  INFECTION_CONTROL: { name:"Infection Control & Sterilization", control:"Dirty-to-clean instrument flow, ultrasonic cycle, packing/sealing, autoclave cycle, storage, same-day completion, biomedical waste", rollsInto:"Infection Control Score", kpis:["Instrument Traceability %","Same-Day Processing %","Packing Compliance %","Autoclave Pass %","Sterile Release Compliance %","Same-Day Sterilization %","BMW Compliance %"] },
  ROOM_CHAIR_READINESS: { name:"Room & Chair Readiness", control:"Consumables, instruments, PPE, RVG sleeves, materials, chair/equipment functionality before patient seating", rollsInto:"Clinic Readiness Score", kpis:[] },
  APPOINTMENT_CONTROL: { name:"Appointment Control", control:"Morning confirmation, reminders, cancellations, rescheduling, unconfirmed patients, next appointment", rollsInto:"Appointment Efficiency", kpis:["Confirmation %","Confirmation Resolution %","Recall Contact %","Registration Completeness %","Average Waiting Time","No-Show Recovery %"] },
  PATIENT_JOURNEY: { name:"Patient Clinical Journey", control:"Arrival → examination → records → consent → treatment → instructions → billing → next appointment → exit", rollsInto:"Patient Care Compliance", kpis:["Medical History Compliance %","Consent Compliance %","Pre-Treatment Documentation %","Radiograph Compliance %","Chairside Readiness %","Pre-op Reminder Compliance %","Pre-op Instruction Compliance %","Procedure Readiness %","Post-Treatment Documentation %","Post-op Instruction Compliance %","Clinical Note Completion %"] },
  CLINICAL_DOCUMENTATION: { name:"Clinical Documentation", control:"Pre/post scans, photographs, X-rays, notes, treatment plan, consent, prescriptions, procedure documentation", rollsInto:"Clinical Documentation Score", kpis:["Medical History Compliance %","Consent Compliance %","Pre-Treatment Documentation %","Radiograph Compliance %","Chairside Readiness %","Pre-op Reminder Compliance %","Pre-op Instruction Compliance %","Procedure Readiness %","Post-Treatment Documentation %","Post-op Instruction Compliance %","Clinical Note Completion %"] },
  SURGICAL_HIGH_RISK: { name:"Surgical & High-Risk Protocols", control:"Pre-op medicine reminder, meal instruction, consent, surgical checklist, post-op instructions, next-day follow-up", rollsInto:"Patient Care Compliance", kpis:["Implant Master Completeness %","Implant Planning Completeness %","Implant Readiness %","Valid Implant Batch %","Implant Traceability %","Implant Inventory Accuracy %"] },
  FOLLOWUP_EXPERIENCE: { name:"Patient Follow-up & Experience", control:"Follow-up due/completed, treatment progress, unresolved complaints, satisfaction, Google review request", rollsInto:"Patient Care Compliance", kpis:["Follow-up Generation %","Surgery Follow-up Compliance %","Clinical Alert Response Time","Follow-up Compliance %","Review Request %","Complaint Capture %","Complaint Acknowledgement Time","Complaint Resolution Time","Complaint Closure %"] },

var AF=["activityId","parameter","subProcess","activity","standard","trigger","frequency",
        "due","doer","checker","evidence","gate","risk","capa","status"];
var ACTS=(function(){
  var byId={},order=[];
  A_ROWS.forEach(function(r){
    var o={}; for(var i=0;i<AF.length;i++) o[AF[i]]=r[i];
    if(byId[o.activityId]){ var s=byId[o.activityId];
      if(s.parameters.indexOf(o.parameter)<0) s.parameters.push(o.parameter); return; }
    o.parameters=[o.parameter]; byId[o.activityId]=o; order.push(o.activityId);
  });
  return order.map(function(id){return byId[id];});
})();
function actsIn(pid){return ACTS.filter(function(a){return a.parameters.indexOf(pid)>=0;});}
// The eight management scores, derived from each parameter's "Rolls into"
var SCORE_LINES=(function(){
  var by={},order=[];
  P_ORDER.forEach(function(pid){
    var k=(P_META[pid]||{}).rollsInto||pid;
    if(!by[k]){by[k]=[];order.push(k);} by[k].push(pid);
  });
  return order.map(function(k){
    return {key:k.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""),label:k,params:by[k]};
  });
})();

// API — the app degrades to structure-only when unreachable
// ═══════════════════════════════════════════════════════════════
function api(action,p){
  p=p||{};p.action=action;p.token=CFG.token;
  if(S.session)p.session=S.session;
  if(!CFG.url)return Promise.reject(new Error("offline"));
  return fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(p),redirect:"follow"})
    .then(function(r){return r.json();})
    .then(function(res){
      S.online=true;
      if(res&&res.needLogin){signOut(true);throw new Error("Session expired");}
      if(!res||!res.success)throw new Error((res&&res.error)||"Request failed");
      return res;});
}
function apiSoft(action,p){return api(action,p).catch(function(){S.online=false;return null;});}

function capturePhoto(mod,ref){
  var desktop=window.matchMedia("(pointer:fine)").matches;
  var cam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  return ((desktop&&cam)?webcam():filePick())
    .then(function(d){toast("Uploading…");return api("uploadPhoto",{dataUrl:d,module:mod,refId:ref||""});})
    .then(function(r){return {photoId:r.photoId,url:r.url};});
}
function filePick(){return new Promise(function(res,rej){
  var i=document.createElement("input");i.type="file";i.accept="image/*";i.capture="environment";
  i.onchange=function(){var f=i.files&&i.files[0];if(!f)return rej(new Error("No photo"));
    shrink(f,1000,.62).then(res).catch(rej);};i.click();});}
function shrink(file,max,q){return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){var w=im.width,h=im.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}
      var c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};
    im.onerror=function(){rej(new Error("Bad image"));};im.src=fr.result;};
  fr.onerror=function(){rej(new Error("Read failed"));};fr.readAsDataURL(file);});}
function webcam(){return new Promise(function(res,rej){
  var sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML='<div class="sheet" style="max-width:620px"><div class="sheet-h">'+
    '<h3 class="t-lg">'+esc(t("takePhoto"))+'</h3></div><div class="sheet-b" style="padding:18px">'+
    '<video autoplay playsinline muted style="width:100%;border-radius:8px;background:#000"></video></div>'+
    '<div class="sheet-f"><button class="btn" data-x="s">'+esc(t("takePhoto"))+'</button>'+
    '<button class="btn ghost" data-x="c">'+esc(t("cancel"))+'</button></div></div>';
  document.body.appendChild(sc);
  var v=sc.querySelector("video"),st=null;
  var stop=function(){if(st)st.getTracks().forEach(function(x){x.stop();});sc.remove();};
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280}}})
    .then(function(s){st=s;v.srcObject=s;})
    .catch(function(){stop();filePick().then(res).catch(rej);});
  sc.addEventListener("click",function(e){
    if(e.target===sc||e.target.dataset.x==="c"){stop();rej(new Error("Cancelled"));}
    if(e.target.dataset.x==="s"){
      if(!v.videoWidth)return toast("Camera starting…","bad");
      var c=document.createElement("canvas"),max=1000,w=v.videoWidth,h=v.videoHeight;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}
      c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
      var d=c.toDataURL("image/jpeg",.62);stop();res(d);}});});}

// SHEET
// ═══════════════════════════════════════════════════════════════
// A sheet covers the whole screen, so there must always be an obvious way
// out of it. Previously the only exit was a Cancel button at the very
// bottom — on a long sheet that sits below the fold, leaving the app
// looking frozen with nothing clickable. Now: a × in the header that is
// always visible, the Escape key, and the backdrop.
function sheet(o){
  // Only ever one sheet. A second opening on top of a first would leave an
  // orphaned overlay behind when the top one closes.
  closeSheets();
  var sc=document.createElement("div");sc.className="scrim";
  sc.innerHTML='<div class="sheet"><div class="sheet-h" style="display:flex;'+
      'align-items:flex-start;gap:12px">'+
    '<div style="flex:1;min-width:0"><h3 class="t-lg">'+esc(o.title)+'</h3>'+
    (o.sub?'<div class="sub" style="margin-top:2px">'+esc(o.sub)+'</div>':'')+'</div>'+
    '<button class="icon-btn" data-x="c" aria-label="Close" '+
      'style="flex:0 0 32px;font-size:17px;line-height:1">&times;</button></div>'+
    '<div class="sheet-b">'+(o.body||"")+'</div>'+
    '<div class="sheet-f">'+(o.actions||'<button class="btn ghost" data-x="c">'+esc(t("cancel"))+'</button>')+
    '</div></div>';
  sc.addEventListener("click",function(e){
    var x=e.target.closest?e.target.closest("[data-x]"):null;
    if(e.target===sc||(x&&x.dataset.x==="c")){sc.remove();return;}
    if(o.onAction&&x){
      var r=o.onAction(x.dataset.x,sc);
      if(r&&r.then)r.then(function(k){if(k!==false)sc.remove();}).catch(function(err){toast(err.message,"bad");});
      else if(r!==false)sc.remove();}});
  document.body.appendChild(sc);return sc;
}
function closeSheets(){
  els(".scrim").forEach(function(s){s.remove();});
}
// Escape always closes, whatever is open. Without it a sheet whose buttons
// are off-screen leaves no way back to the app at all.
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeSheets();
});
function sv(sc,n){var e=sc.querySelector('[name="'+n+'"]');return e?e.value.trim():"";}

function signIn(){
  var ph=$("lPhone").value.replace(/\D/g,""),pin=$("lPin").value;
  if(!ph||!pin)return toast("Enter number and PIN","bad");
  $("bLogin").disabled=true;
  api("login",{phone:ph,pin:pin}).then(function(r){
    S.session=r.session;S.user=r.user;
    localStorage.setItem("kubi.session",r.session);
    localStorage.setItem("kubi.user",JSON.stringify(r.user));boot();
  }).catch(function(e){toast(e.message==="offline"?"Server not configured":e.message,"bad");})
    .finally(function(){$("bLogin").disabled=false;});
}
function signOut(quiet){
  if(!quiet)api("logout",{}).catch(function(){});
  S.session="";S.user=null;
  localStorage.removeItem("kubi.session");localStorage.removeItem("kubi.user");
  $("app").classList.add("hide");$("login").classList.remove("hide");
}
function openCfg(){
  sheet({title:t("server"),sub:"From kubiSetupAll() in Apps Script",
    body:'<div style="padding:18px"><label>Web app /exec URL</label><input name="u" value="'+esc(CFG.url)+'">'+
      '<label>OPS_TOKEN</label><input name="k" value="'+esc(CFG.token)+'"></div>',
    actions:'<button class="btn" data-x="save">'+esc(t("save"))+'</button>'+
      '<button class="btn ghost" data-x="c">'+esc(t("cancel"))+'</button>',
    onAction:function(a,sc){if(a!=="save")return;
      CFG.url=sv(sc,"u");CFG.token=sv(sc,"k");
      localStorage.setItem("kubi.url",CFG.url);localStorage.setItem("kubi.token",CFG.token);

// ═══════════════════════════════════════════════════════════════
// SHARED
// ═══════════════════════════════════════════════════════════════
function ring(pct,band,size){
  size=size||110;
  var r=(size/2)-9,c=2*Math.PI*r,v=(pct==null)?0:pct;
  var col=band==="green"?"var(--green)":band==="amber"?"var(--amber)":
          band==="red"?"var(--red)":"var(--line-2)";
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg)">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="9"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="9"'+
    ' stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c-(c*v/100))+'"/></svg>'+
    '<div class="v"><b style="color:'+col+'">'+(pct==null?"–":pct+"%")+'</b></div></div>';
}
function band(pct,hasRed){
  if(hasRed)return "red";
  if(pct==null)return "grey";
  return pct>=95?"green":pct>=85?"amber":"red";
}
function bandCol(b){return b==="green"?"var(--green)":b==="amber"?"var(--amber)":
  b==="red"?"var(--red)":"var(--ink-4)";}
function emptyState(title,msg,icon,tone){
  return '<div class="empty"><div class="ico"'+(tone?' style="background:'+tone+'20;color:'+tone+'"':'')+'>'+
    (icon||"✓")+'</div><div class="ttl">'+esc(title)+'</div><div class="sub">'+esc(msg)+'</div></div>';
}
function offlineBanner(){
  return S.online?"":'<div class="card"><div class="sec warn">'+esc(t("offline"))+'</div>'+
    '<div style="padding:12px 16px" class="sub">'+esc(t("offlineMsg"))+'</div></div>';
}

// DASHBOARD
// ═══════════════════════════════════════════════════════════════
function vDash(){
  $("view").innerHTML='<div class="card"><div class="empty"><div class="sub">…</div></div></div>';
  Promise.all([apiSoft("kubi.scoreboard",{from:todayStr(),to:todayStr()}),
               apiSoft("v2.today",{date:todayStr()})])
  .then(function(r){
    var sb=r[0],td=r[1];
    if(td){S.badges.exceptions=td.openExceptions||0;S.badges.verify=td.verifyCount||0;buildNav();}
    var lines=sb?sb.lines:SCORE_LINES.map(function(l){
      return {key:l.key,label:l.label,pct:null,outcome:"grey",deviationCount:0,deviations:[],
              done:0,of:0};});
    S.cache.lines=lines;
    var score=sb?sb.score:null, out=sb?sb.outcome:"grey";
    var totals=sb?sb.totals:{deviations:0,red:0,amber:0};
    var clinicName=(sb&&sb.clinic&&sb.clinic.name)||"K.B. Dental";

    var html=offlineBanner();
    html+='<div class="card"><div class="hero">'+ring(score,out,116)+
      '<div style="flex:1;min-width:0">'+
      '<div class="cap">'+esc(t("opScore"))+'</div>'+
      '<div class="t-lg" style="margin-top:3px">'+esc(clinicName)+'</div>'+
      '<div class="sub">'+esc(todayStr())+'</div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+
        (totals.red?'<span class="chip c-red">'+totals.red+' red</span>':'')+
        (totals.amber?'<span class="chip c-amber">'+totals.amber+' amber</span>':'')+
        (totals.deviations?'<span class="chip c-grey">'+totals.deviations+' '+esc(t("deviations"))+'</span>'
          :'<span class="chip c-green">'+esc(t("noDeviations"))+'</span>')+
      '</div></div></div>'+
      '<div class="kpis">'+lines.map(function(l){
        return '<div class="kpi" data-line="'+esc(l.key)+'">'+
          '<div class="kt"><b style="color:'+bandCol(l.outcome)+'">'+(l.pct==null?"–":l.pct+"%")+'</b>'+
          (l.of?'<span class="of num">'+l.done+"/"+l.of+'</span>':'')+'</div>'+
          '<div class="kl">'+esc(l.label)+'</div>'+
          '<div class="meter"><i style="width:'+(l.pct==null?0:l.pct)+'%;background:'+
            bandCol(l.outcome)+'"></i></div>'+
          (l.deviationCount?'<div class="dev">'+l.deviationCount+' '+esc(t("deviations"))+'</div>':'')+
        '</div>';}).join("")+'</div></div>';

    // Today's pulse
    if(td&&td.summary){
      var s=td.summary;
      html+='<div class="card"><div class="sec">'+esc(t("today"))+'</div><div class="strip">'+
        '<div class="st"><b>'+s.done+'/'+(s.total-s.na)+'</b><span>'+esc(t("done"))+'</span></div>'+
        '<div class="st"><b style="color:'+(s.exception?"var(--red)":"var(--ink)")+'">'+s.exception+
          '</b><span>'+esc(t("exception"))+'</span></div>'+
        '<div class="st"><b style="color:'+(s.overdue?"var(--amber)":"var(--ink)")+'">'+s.overdue+
          '</b><span>'+esc(t("overdue"))+'</span></div>'+
        '<div class="st"><b>'+(td.verifyCount||0)+'</b><span>'+esc(t("verify"))+'</span></div>'+
        '<div class="st"><b style="color:'+((td.openExceptions||0)?"var(--red)":"var(--ink)")+'">'+
          (td.openExceptions||0)+'</b><span>'+esc(t("openIssues"))+'</span></div>'+
      '</div></div>';
    }

    // Attention — only the deviations, never the 100 things that went right
    var attn=[];
    lines.forEach(function(l){(l.deviations||[]).forEach(function(d){
      attn.push({line:l.label,d:d});});});
    attn.sort(function(a,b){var r={red:0,amber:1,grey:2};return r[a.d.severity]-r[b.d.severity];});
    if(attn.length){
      html+='<div class="card"><div class="sec bad">'+esc(t("needsAttention"))+
        '<span class="n num">'+attn.length+'</span></div>'+
        attn.slice(0,12).map(function(x){
          return '<div class="row click" data-line="'+esc(lineKeyOf(x.line))+'">'+
            '<span class="dot d-'+x.d.severity+'"></span>'+
            '<div class="grow"><div class="rname">'+esc(x.d.label)+'</div>'+
            '<div class="rmeta">'+esc(x.line)+'</div></div><span class="arw">›</span></div>';
        }).join("")+'</div>';
    } else if(sb){
      html+='<div class="card">'+emptyState(t("noAttention"),t("noAttentionMsg"))+'</div>';
    }

    // Parameter health — proof that all 16 are governed, live or not
    html+=paramHealthCard(sb);
    $("view").innerHTML=html;
  });
}
function lineKeyOf(label){
  var f=SCORE_LINES.filter(function(l){return l.label===label;})[0];
  return f?f.key:"";
}
function paramHealthCard(sb){
  var live={};
  if(sb&&sb.parameters)sb.parameters.forEach(function(p){live[p.paramId]=p;});
  return '<div class="card"><div class="sec">'+esc(t("params"))+
    '<span class="n num">'+P_ORDER.length+'</span></div>'+
    P_ORDER.map(function(pid){
      var m=P_META[pid],p=live[pid];

      return '<div class="row click" data-param="'+esc(pid)+'">'+
        '<span class="dot d-'+o+'"></span>'+
        '<div class="grow"><div class="rname">'+esc(m.name)+'</div>'+
        '<div class="rmeta"><span>'+n+' '+esc(t("activities")).toLowerCase()+'</span>'+
        '<span class="chip c-grey">'+esc(m.rollsInto)+'</span></div></div>'+
        (p&&p.pct!=null?'<b class="num" style="color:'+bandCol(p.band)+'">'+p.pct+'%</b>':
          '<span class="chip c-grey">'+esc(t("off"))+'</span>')+
        '<span class="arw">›</span></div>';
    }).join("")+'</div>';
}

// ═══════════════════════════════════════════════════════════════
var STATE_CHIP={done:["c-green","done"],verified:["c-blue","verified"],overdue:["c-amber","overdue"],
  exception:["c-red","exception"],na:["c-grey","na"],due:["c-grey","pending"],
  notdue:["c-grey","pending"],inprogress:["c-amber","pending"]};
function taskRow(x){
  var settled=["done","verified","na"].indexOf(x.state)>=0;
  var title=(S.lang==="hi"&&x.titleHi)?x.titleHi:x.titleEn;
  var blocked=!!x.blockedBy;
  var cls="task"+(x.state==="exception"?" attn":x.state==="overdue"?" late":"")+(settled?" settled":"");
  var tick=x.state==="verified"?"tick ver":x.state==="na"?"tick na":settled?"tick on":
           blocked?"tick lock":"tick";
  var mark=x.state==="verified"?"✓":x.state==="na"?"–":blocked?"🔒":"✓";
  var sc=STATE_CHIP[x.state]||STATE_CHIP.due;
  var meta=[];
  if(!settled)meta.push('<span>'+esc(t("by"))+' <b>'+esc(x.dueTime||"")+'</b></span>');
  meta.push('<span class="chip '+sc[0]+'">'+esc(t(sc[1]))+'</span>');
  if(!settled&&x.needsPhoto)meta.push('<span class="chip c-amber">📷 '+esc(t("photoNeeded"))+'</span>');
  if(!settled&&x.needsValue)meta.push('<span class="chip c-amber">'+esc(t("readingNeeded"))+'</span>');
  if(x.state==="done"&&x.checkerRole)meta.push('<span class="chip c-amber">'+esc(t("needsCheck"))+'</span>');
  if(settled&&x.doneByName)meta.push('<span>'+esc(x.doneByName)+'</span>');
  meta.push('<span class="mono" style="color:var(--ink-4)">'+esc(x.activityId)+'</span>');
  return '<div class="'+cls+'" data-task="'+esc(x.taskId)+'">'+
    '<span class="pri pri-'+esc(x.priority)+'"></span>'+
    '<div class="'+tick+'">'+mark+'</div>'+
    '<div class="grow"><div class="ttitle">'+esc(title)+'</div>'+
    '<div class="rmeta">'+meta.join("")+'</div>'+
    (blocked?'<div class="blocked">🔒 '+esc(t("waitingFor"))+' '+esc(x.blockedBy)+'</div>':'')+
    '</div></div>';
}
// The role briefing: what THIS person needs to know, assembled from the
// domain tables. A flat task list can say "11 things due"; it cannot say
// three sterilization batches are unfinished or that Mr Bose's crown has
// passed QC and nobody has rung him.
function vToday(){
  apiSoft("kubi.briefing",{date:todayStr()}).then(function(r){
    if(!r)return $("view").innerHTML=offlineBanner()+
      '<div class="card">'+emptyState(t("offline"),t("offlineMsg"),"○","#0078B4")+'</div>';
    S.cache.brief=r;
    // Every task item across all sections, so a tap can find its task.
    S.cache.today={tasks:[]};
    (r.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){
      if(i.kind==="task")S.cache.today.tasks.push({
        taskId:i.id,activityId:i.activityId,titleEn:i.text,state:i.state,
        priority:i.priority,blockedBy:i.blockedBy,needsPhoto:i.needsPhoto,
        needsValue:i.needsValue,checkerRole:i.checkerRole,dueTime:""});});});
    S.badges.exceptions=r.attention||0;buildNav();

    var s=r.summary||{total:0,done:0,na:0,pct:null};
    var html="";
    if(s.total){
      html+='<div class="card"><div class="card-p" style="display:flex;align-items:center;gap:16px">'+
        ring(s.pct,band(s.pct,r.attention>0),82)+
        '<div style="flex:1"><div class="cap">'+esc(r.roleLabel||"")+'</div>'+
        '<div class="t-xl num" style="margin-top:2px">'+s.done+
        '<span class="sub" style="font-size:15px;font-weight:400"> / '+(s.total-s.na)+'</span></div>'+
        (r.attention?'<div style="margin-top:8px"><span class="chip c-red">'+r.attention+
          ' '+esc(t("needsAttention")).toLowerCase()+'</span></div>':'')+
        '</div></div></div>';
    }

    html+=(r.sections||[]).map(function(sec){
      var tone=sec.tone==="red"?" bad":sec.tone==="amber"?" warn":" ok";
      if(!sec.count)
        return '<div class="card"><div class="sec ok">'+esc(sec.label)+
          '<span class="n num">0</span></div>'+
          '<div style="padding:14px 16px" class="sub">'+
          esc(sec.hint||t("allDoneMsg"))+'</div></div>';
      return '<div class="card"><div class="sec'+tone+'">'+esc(sec.label)+
        '<span class="n num">'+sec.count+'</span></div>'+
        (sec.hint?'<div style="padding:9px 16px;border-bottom:1px solid var(--line)" '+
          'class="sub">'+esc(sec.hint)+'</div>':'')+
        sec.items.map(briefRow).join("")+
        (sec.count>sec.items.length?'<div style="padding:10px 16px" class="sub">+'+
          (sec.count-sec.items.length)+' more</div>':'')+
      '</div>';}).join("");

    $("view").innerHTML=html||'<div class="card">'+
      emptyState(t("nothingYet"),t("nothingMsg"),"○","#0078B4")+'</div>';
  });
}

// A task can be completed from the briefing; a fact is there to be read.
function briefRow(i){
  if(i.kind!=="task"){
    return '<div class="row"><span class="dot d-'+(i.tone||"grey")+'"></span>'+
      '<div class="grow"><div class="rname">'+esc(i.text)+'</div>'+
      (i.detail?'<div class="rmeta">'+esc(i.detail)+'</div>':'')+'</div></div>';
  }
  var settled=["done","verified","na"].indexOf(i.state)>=0;
  var blocked=!!i.blockedBy;
  var cls="task"+(i.state==="exception"?" attn":i.state==="overdue"?" late":"")+
          (settled?" settled":"");
  var tick=i.state==="verified"?"tick ver":i.state==="na"?"tick na":settled?"tick on":
           blocked?"tick lock":"tick";
  var mark=i.state==="verified"?"✓":i.state==="na"?"–":blocked?"🔒":"✓";
  var meta=[];
  if(i.detail)meta.push('<span>'+esc(i.detail)+'</span>');
  if(!settled&&i.needsPhoto)meta.push('<span class="chip c-amber">📷 '+esc(t("photoNeeded"))+'</span>');
  if(!settled&&i.needsValue)meta.push('<span class="chip c-amber">'+esc(t("readingNeeded"))+'</span>');
  if(i.state==="done"&&i.checkerRole)meta.push('<span class="chip c-amber">'+esc(t("needsCheck"))+'</span>');
  if(i.activityId)meta.push('<span class="mono" style="color:var(--ink-4)">'+esc(i.activityId)+'</span>');
  return '<div class="'+cls+'" data-task="'+esc(i.id)+'">'+
    '<span class="pri pri-'+esc(i.priority||"ROUTINE")+'"></span>'+
    '<div class="'+tick+'">'+mark+'</div>'+
    '<div class="grow"><div class="ttitle">'+esc(i.text)+'</div>'+
    (meta.length?'<div class="rmeta">'+meta.join("")+'</div>':'')+
    (blocked?'<div class="blocked">🔒 '+esc(t("waitingFor"))+' '+esc(i.blockedBy)+'</div>':'')+
    '</div></div>';
}
function vVerify(){
  apiSoft("v2.verifyQueue",{}).then(function(r){
    if(!r)return $("view").innerHTML=offlineBanner();
    S.cache.verify=r.tasks;S.badges.verify=r.tasks.length;buildNav();
    if(!r.tasks.length)return $("view").innerHTML='<div class="card">'+
      emptyState(t("nothingVerify"),t("nothingVerifyMsg"))+'</div>';
    $("view").innerHTML='<div class="card"><div class="sec">'+esc(t("verify"))+
      '<span class="n num">'+r.tasks.length+'</span></div>'+
      r.tasks.map(function(x){
        return '<div class="task"><span class="pri pri-'+esc(x.priority)+'"></span>'+
          '<div class="grow"><div class="ttitle">'+esc(x.titleEn)+'</div>'+
          '<div class="rmeta"><span class="chip c-green">'+esc(t("done"))+'</span>'+
          '<span>'+esc(x.doneByName)+'</span>'+
          (x.value?'<span class="chip c-blue">'+esc(x.value)+'</span>':'')+
          '<span class="mono">'+esc(x.activityId)+'</span></div></div>'+
          '<button class="btn sm" data-verify="'+esc(x.taskId)+'">'+esc(t("verifyIt"))+'</button></div>';
      }).join("")+'</div>';
  });
}

// ═══════════════════════════════════════════════════════════════
// TASK ACTION
// ═══════════════════════════════════════════════════════════════
function openTask(taskId){
  var pool=((S.cache.today&&S.cache.today.tasks)||[]).concat(S.cache.verify||[]);
  var x=pool.filter(function(y){return y.taskId===taskId;})[0];
  if(!x)return;
  var title=(S.lang==="hi"&&x.titleHi)?x.titleHi:x.titleEn;
  var settled=["done","verified","na"].indexOf(x.state)>=0;
  if(x.blockedBy)return sheet({title:title,sub:x.activityId,
    body:'<div style="padding:18px"><div class="blocked">🔒 '+esc(t("waitingFor"))+' <b>'+
      esc(x.blockedBy)+'</b></div><div class="sub" style="margin-top:12px">'+esc(t("cantYet"))+
      '.</div></div>'});
  if(settled){
    var b='<div style="padding:18px"><div style="display:flex;gap:6px;flex-wrap:wrap">'+
      '<span class="chip '+STATE_CHIP[x.state][0]+'">'+esc(t(STATE_CHIP[x.state][1]))+'</span>'+
      (x.doneByName?'<span class="chip c-grey">'+esc(x.doneByName)+'</span>':'')+'</div>'+
      (x.value?'<label>'+esc(t("reading"))+'</label><div>'+esc(x.value)+'</div>':'')+
      (x.naReason?'<label>'+esc(t("why"))+'</label><div>'+esc(x.naReason)+'</div>':'')+'</div>';
    return sheet({title:title,sub:x.activityId,body:b,
      actions:'<button class="btn ghost" data-x="undo">'+esc(t("undo"))+'</button>'+
        '<button class="btn ghost" data-x="c">'+esc(t("cancel"))+'</button>',
      onAction:function(a){if(a==="undo")return act(taskId,{act:"undo"});}});
  }
  var form='<div style="padding:18px">';
  if(x.needsValue)form+='<label>'+esc(t("reading"))+'</label><input name="value" inputmode="decimal" '+
    'placeholder="'+esc(x.evidenceNote||"")+'">';
  form+='<label>'+esc(t("note"))+'</label><textarea name="note" rows="2"></textarea>';
  if(x.needsPhoto)form+='<div class="chip c-amber" style="margin-top:12px">📷 '+esc(t("photoNeeded"))+'</div>';
  form+='</div>';
  sheet({title:title,sub:x.activityId,body:form,
    actions:'<button class="btn ok big" data-x="done">'+esc(t("markDone"))+'</button>'+
      '<button class="btn ghost" data-x="na">'+esc(t("notApplicable"))+'</button>'+
      '<button class="btn ghost" data-x="c">'+esc(t("cancel"))+'</button>',
    onAction:function(a,sc){
      if(a==="na"){var why=prompt(t("why"));if(!why)return false;return act(taskId,{act:"na",note:why});}
      if(a!=="done")return;
      var p={act:"done",note:sv(sc,"note")};
      if(x.needsValue){if(!sv(sc,"value")){toast(t("readingNeeded"),"bad");return false;}
        p.value=sv(sc,"value");}
      if(x.needsPhoto)return capturePhoto("task",taskId).then(function(ph){
        p.photoId=ph.photoId;return act(taskId,p);});
      return act(taskId,p);}});
}
function act(taskId,p){
  p.taskId=taskId;
  return api("v2.act",p).then(function(r){
    toast(r.awaitingVerification?t("needsCheck"):t("done"),"ok");render();return r;
  }).catch(function(e){toast(e.message,"bad");throw e;});
}

// ═══════════════════════════════════════════════════════════════
// DRILL-DOWN
// ═══════════════════════════════════════════════════════════════
function openLine(key){
  var l=(S.cache.lines||[]).filter(function(x){return x.key===key;})[0];
  if(!l){
    var meta=SCORE_LINES.filter(function(x){return x.key===key;})[0];
    if(!meta)return;
    l={label:meta.label,pct:null,deviations:[],deviationCount:0,params:meta.params};
  }
  if(!l.deviations||!l.deviations.length)
    return sheet({title:l.label,sub:l.pct==null?"":l.pct+"%",
      body:emptyState(t("noDeviations"),t("noAttentionMsg"))});
  var body=l.deviations.map(function(d){
    return '<div style="padding:14px 18px;border-bottom:1px solid var(--line)">'+
      '<div style="display:flex;gap:8px;align-items:center;font-weight:700">'+
      '<span class="dot d-'+d.severity+'"></span><span style="flex:1">'+esc(d.label)+'</span></div>'+
      (d.refs&&d.refs.length?'<div style="margin-top:8px;display:grid;gap:6px">'+
        d.refs.map(function(rf){
          return '<div style="background:var(--blue-wash);border:1px solid var(--line);'+
            'border-radius:6px;padding:9px 11px;font-size:13px">'+
            '<b>'+esc(rf.text)+'</b>'+(rf.detail?'<div class="sub" style="font-size:11.5px;'+
            'margin-top:2px">'+esc(rf.detail)+'</div>':'')+'</div>';}).join("")+'</div>':'')+
      '</div>';}).join("");
  sheet({title:l.label,sub:(l.pct==null?"":l.pct+"% · ")+l.deviationCount+" "+t("deviations"),body:body});
}

// ═══════════════════════════════════════════════════════════════
// LANGUAGE + EVENTS
// ═══════════════════════════════════════════════════════════════
function setLang(l,skipRender){
  S.lang=l;localStorage.setItem("kubi.lang",l);
  els("[data-t]").forEach(function(n){n.textContent=t(n.dataset.t);});
  var b=$("bLang");if(b)b.textContent=(l==="en"?"हिंदी":"English");
  document.documentElement.lang=l;
  if(S.user&&!skipRender){buildNav();render();}
}
document.addEventListener("click",function(e){
  var n;
  if((n=e.target.closest("[data-nav]")))return go(n.dataset.nav);
  if((n=e.target.closest("[data-task]")))return openTask(n.dataset.task);
  if((n=e.target.closest("[data-line]")))return openLine(n.dataset.line);
  if((n=e.target.closest("[data-param]")))return openParam(n.dataset.param);
  if((n=e.target.closest("[data-lang]")))return setLang(n.dataset.lang);
  if((n=e.target.closest("[data-period]"))){S.period=n.dataset.period;return vReports();}
  if((n=e.target.closest("[data-live]"))){
    var pid=n.dataset.live,on=n.dataset.on!=="1";
    n.classList.toggle("on",on);n.dataset.on=on?"1":"0";
    return api("v2.setParamLive",{paramId:pid,live:on})
      .then(function(){toast(on?t("live"):t("off"),"ok");})
      .catch(function(err){toast(err.message,"bad");vParams();});
  }
  if((n=e.target.closest("[data-verify]"))){
    var id=n.dataset.verify;
    return sheet({title:t("confirmVerify"),
      body:'<div style="padding:18px"><label>'+esc(t("note"))+'</label>'+
        '<textarea name="note" rows="2"></textarea></div>',
      actions:'<button class="btn ok" data-x="v">'+esc(t("verifyIt"))+'</button>'+
        '<button class="btn ghost" data-x="c">'+esc(t("cancel"))+'</button>',
      onAction:function(a,sc){if(a==="v")return act(id,{act:"verify",note:sv(sc,"note")});}});
  }
  if((n=e.target.closest("[data-ack]"))){
    return api("v2.ackException",{excId:n.dataset.ack})
      .then(function(){toast("Acknowledged","ok");vExc();})
      .catch(function(err){toast(err.message,"bad");});
  }
  switch(e.target.id){
    case "bLogin":return signIn();
    case "bCfg":case "bCfg2":return openCfg();
    case "bLang":return setLang(S.lang==="en"?"hi":"en");
    case "bOut":return signOut();
  }
});
$("lPin").addEventListener("keydown",function(e){if(e.key==="Enter")signIn();});

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
function boot(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  $("vWho").textContent=S.user.name+" · "+String(S.user.role).replace(/_/g," ");
  S.cache={};S.badges={};
  setLang(S.lang,true);go(homeFor());
}
setLang(S.lang,true);
if(S.session&&S.user&&CFG.url){
  api("me",{}).then(boot).catch(function(){signOut(true);checkServer();});
}else{checkServer();}
</script>

  var BAR_H = 42;
  function mountSwitcher() {
    if (document.getElementById("demoBar")) return;

    });

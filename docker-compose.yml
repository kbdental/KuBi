# KuBi local development stack. Phase 1 Step 4.
#
# NOTE: in the Phase 1 build environment the Docker Hub CDN was blocked by
# egress policy (403), so these services were run natively instead and this file
# is UNVERIFIED in that environment. See docs/operations/phase-1-deviations.md.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kubi_migrator
      POSTGRES_PASSWORD: devmigrator
      POSTGRES_DB: kubi_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kubi_migrator -d kubi_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kubi-dev
      MINIO_ROOT_PASSWORD: kubi-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  miniodata:
